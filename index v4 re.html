<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html{color-scheme:light dark}body{margin:0;font-size:14px}</style>
<title>Alzamientos Pendientes</title>
<meta name="description" content="Alzamientos pendientes por proyecto y banco alzante. Inmobiliaria e Inversiones Malpo SpA.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: encabezado + barra de filtros (chips) + tabla ordenable con resumen de cuota total */
:root{--bg:#f5f5f3;--surface:#fff;--fg:#232624;--muted:#686c67;--line:#dedfdb;--accent:#931022;--accent-fg:#fff;--accent-soft:#f6e8ea;--brand:#931022;--charcoal:#4a4d49;--warn:#9a5b00;--warn-bg:#fdf0d5;--crit:#a3261c;--crit-bg:#fbe3e0;--ok:#2f6b3f;--ok-bg:#e3f2e6;
--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141615;--surface:#1d201e;--fg:#e8e9e6;--muted:#9a9e98;--line:#2f3330;--accent:#e0707f;--accent-fg:#1a0509;--accent-soft:#33191d;--brand:#931022;--charcoal:#4a4d49;--warn:#f0c26a;--warn-bg:#3a2e12;--crit:#f2a39b;--crit-bg:#3d1a17;--ok:#8fd19e;--ok-bg:#183222;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141615;--surface:#1d201e;--fg:#e8e9e6;--muted:#9a9e98;--line:#2f3330;--accent:#e0707f;--accent-fg:#1a0509;--accent-soft:#33191d;--brand:#931022;--charcoal:#4a4d49;--warn:#f0c26a;--warn-bg:#3a2e12;--crit:#f2a39b;--crit-bg:#3d1a17;--ok:#8fd19e;--ok-bg:#183222;color-scheme:dark}
body{padding-top:0!important;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;padding-inline:16px;padding-block:24px}
.wrap{max-width:1180px;margin:20px auto 0;display:flex;flex-direction:column;gap:20px}
#brand{background:var(--brand);margin-inline:-16px;padding:14px 16px;border-bottom:4px solid var(--charcoal)}
#brand .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
#brand img{height:38px;width:auto;display:block}
#brand span{color:#fff;opacity:.85;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:4px}
.sum{display:flex;gap:24px}
.sum div{display:flex;flex-direction:column}
.sum b{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.sum span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.filters{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.grp{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grp>label{width:110px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.search{flex:1;min-width:220px;max-width:420px}
.search input{width:100%;box-sizing:border-box;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:6px 14px;border-radius:999px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip small{font-family:var(--mono);color:var(--muted);font-size:11px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.chip:focus-visible,th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface);border-bottom:2px solid var(--charcoal);position:sticky;top:0}
th button{all:unset;cursor:pointer}
th button::after{content:" ↕";opacity:.35}
th[aria-sort="ascending"] button::after{content:" ↑";opacity:1;color:var(--accent)}
th[aria-sort="descending"] button::after{content:" ↓";opacity:1;color:var(--accent)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--accent-soft)}
.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
td.name{white-space:normal;min-width:150px}
.tag{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:500}
.t-crit{background:var(--crit-bg);color:var(--crit)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-ok{background:var(--ok-bg);color:var(--ok)}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--muted)}
.foot{margin-top:-4px;color:var(--muted);font-size:12px}
@media (max-width:600px){.grp>label{width:100%}.sum{gap:16px}}
</style>
</head>

const hit=r=>{if(!q.trim())return true;const a=norm(q).trim().split(/\s+/);const qr=nr(q);return a.every(w=>r._n.includes(w))||(qr.length>=2&&/\d/.test(qr)&&r._r.includes(qr))};let sort={k:"f",d:1};
const $=id=>document.getElementById(id);
const today=new Date();today.setHours(0,0,0,0);
const fmtN=v=>v==null?"—":v.toLocaleString("es-CL",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD=s=>s?s.split("-").reverse().join("-"):"—";
const days=s=>s?Math.round((new Date(s+"T00:00:00")-today)/864e5):null;
$("asof").textContent="Al "+today.toLocaleDateString("es-CL",{day:"numeric",month:"long",year:"numeric"});
function chips(key,el){
  const vals=[...new Set(DATA.map(r=>r[key]))].sort();
  const base=DATA.filter(hit);const mk=(v,label,n)=>`<button class="chip" data-k="${key}" data-v="${v??""}" aria-pressed="${sel[key]===v}">${label}<small>${n}</small></button>`;
  el.innerHTML=mk(null,"Todos",base.filter(r=>(key==="p"?sel.b:sel.p)==null||r[key==="p"?"b":"p"]===(key==="p"?sel.b:sel.p)).length)+
    vals.map(v=>mk(v,v,base.filter(r=>r[key]===v&&(key==="p"?sel.b==null||r.b===sel.b:sel.p==null||r.p===sel.p)).length)).join("");
}
function render(){
  chips("p",$("fP"));chips("b",$("fB"));
  const rows=DATA.filter(r=>(!sel.p||r.p===sel.p)&&(!sel.b||r.b===sel.b)&&hit(r));
  rows.sort((a,b)=>{let x=a[sort.k],y=b[sort.k];if(x==null)return 1;if(y==null)return -1;return (typeof x==="number"?x-y:String(x).localeCompare(y,"es",{numeric:true}))*sort.d});
  $("head").innerHTML=COLS.map(([k,t])=>`<th class="${k==="c"?"num":""}" aria-sort="${sort.k===k?(sort.d>0?"ascending":"descending"):"none"}"><button data-s="${k}">${t}</button></th>`).join("");
  $("body").innerHTML=rows.map(r=>{
    const d=days(r.f);let tag="";
    if(d!=null){tag=d<0?`<span class="tag t-crit">Vencido ${-d} d</span>`:d<=7?`<span class="tag t-warn">${d===0?"Hoy":"En "+d+" d"}</span>`:`<span class="tag t-ok">En ${d} d</span>`}
    return `<tr><td class="name" style="min-width:130px">${r.p}</td><td class="mono">${r.m}</td><td class="mono">${r.l}</td><td class="mono">${r.rut}</td><td class="name">${r.n}</td><td>${r.b}</td><td class="num">${fmtN(r.c)}</td><td class="mono">${fmtD(r.f)}${tag}</td><td class="mono">${r.s?fmtD(r.s):"—"}</td></tr>`}).join("");
  const tot=rows.reduce((s,r)=>s+(r.c||0),0);
  $("empty").hidden=rows.length>0;
  $("sCount").textContent=rows.length;$("sTotal").textContent=fmtN(tot);
  $("foot").innerHTML=rows.length?`<tr><td colspan="6">Total (${rows.length} casos)</td><td class="num">${fmtN(tot)}</td><td></td><td></td></tr>`:"";
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(c){sel[c.dataset.k]=c.dataset.v||null;render();return}
  const s=e.target.closest("[data-s]");if(s){const k=s.dataset.s;sort=sort.k===k?{k,d:-sort.d}:{k,d:1};render()}
});
$("q").addEventListener("input",e=>{q=e.target.value;render()});
render();
</script>

</body>
</html>
